<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <audio id="ringtone" src="/sounds/ringtone.mp3" loop></audio>
    <section class="chat_section">
      <div class="brand">
        <button id="backBtn" style="display: none">⬅</button>

        <img height="40" src="/logo.png" alt="" />

        <div class="chat-header">
          <h3 id="chatUser">Select User</h3>
          <span id="userStatus">🔴 Offline</span>
        </div>

        <div class="header-actions">
          <button id="callBtn">📞</button>
          <button id="videoCallBtn">🎦</button>
          <button id="themeBtn">🌙</button>
        </div>
      </div>
      <div class="users-panel" id="usersPanel">
        <h3>Users</h3>
        <div id="usersList"></div>
      </div>

      <div class="message_area"></div>
      <div class="typing" id="typing"></div>

      <div id="emojiPicker" class="emoji-picker"></div>

      <div id="imagePreview" class="image-preview" style="display: none">
        <img id="previewImg" />
        <button id="cancelPreview">✖</button>
      </div>

      <div class="send_area">
        <button id="emojiBtn">😊</button>
        <input type="file" id="imageInput" accept="image/*" hidden />

        <input
          type="file"
          id="fileInput"
          accept=".pdf,.doc,.docx,.zip,.rar,.txt"
          hidden
        />

        <button id="imageBtn">🖼️</button>
        <button id="fileBtn">📎</button>
        <textarea
          id="textarea"
          rows="1"
          placeholder="Type your message here..."
        ></textarea>
        <button id="recordBtn">🎤</button>
        <button id="sendBtn">➤</button>
      </div>
    </section>

    <!-- Full Image Viewer -->
    <div id="imageModal" class="image-modal">
      <span id="closeModal">&times;</span>
      <img id="modalImage" />
    </div>

    <!-- Incoming Call -->
    <div id="incomingCall" class="call-popup">
      <h2>📞 Incoming Call</h2>

      <p id="callerName">Someone is calling...</p>

      <div class="call-buttons">
        <button id="acceptCall">✅ Accept</button>
        <button id="rejectCall">❌ Reject</button>
      </div>
    </div>

    <!-- Calling Screen -->
    <!-- Calling Screen -->
    <div class="calling-screen" id="callingScreen">
      <video id="remoteVideo" autoplay playsinline class="remote-video"></video>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
        class="local-video"
      ></video>

      <h2 id="callStatus">Waiting...</h2>

      <div class="call-controls">
        <button id="muteBtn">🎤 Mute</button>

        <button id="cameraBtn">📷 Off</button>
        <button id="switchCameraBtn">🔄 Camera</button>

        <button id="endCall">❌ End Call</button>
      </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
